# Explicit CF-only production routes; defaults remain open when omitted.
[server]
listen = "0.0.0.0:443"
tls_handshake_timeout_seconds = 10
websocket_upgrade_timeout_seconds = 10
backend_connect_timeout_seconds = 3
shutdown_grace_seconds = 30
max_websocket_message_size_bytes = 1048576
max_grpc_concurrent_streams_per_backend = 256
max_connections = 20000
max_concurrent_tls_handshakes = 512
max_active_requests = 20000
max_http_header_count = 100
max_http_header_bytes = 32768
http_header_read_timeout_seconds = 10
max_http2_concurrent_streams = 256
max_http2_send_buffer_bytes = 65536

[tls]
cert_dir = "certs"
cert_suffix = ".fullchain.pem"
key_suffix = ".key.pem"
default_certificate = "gateway"

[routing]
require_sni = true
# Default: request host must equal SNI. Explicit binding overrides this default
# for that SNI, permitting only the listed configured hosts, on every H2 stream.
# [[routing.sni_bindings]]
# sni = "origin.example.com"
# hosts = ["a.example.com", "b.example.com"]

[security]
# Only these peers may reach /health/live and /health/ready.
health_peer_cidrs = ["127.0.0.0/8", "::1/128"]
# Any enabled route with security.cloudflare_only=true automatically activates
# the official CF CIDR cache. Add [security.cloudflare] even with all routes open
# if you want verified CF client identity on mixed/direct routes.
[security.cloudflare]
cache_file = "state/cloudflare-cidrs.txt" # optional; managed automatically

[http_proxy]
# Aggregate socket capacity across all ordinary HTTP/fallback pools.
max_connections = 20000

[acme]
enabled = false
http01_listen = "0.0.0.0:80"
environment = "staging"
state_dir = "state/acme"
fallback_renew_before_days = 30
check_interval_hours = 12
# email = "admin@example.com"
# [[acme.certificates]]
# id = "gateway"
# domains = ["a.example.com", "b.example.com"]
# HTTP-01 has its own bounded challenge-only listener. A CF-only firewall on
# the TLS business port must not inadvertently block direct CA validation :80.

[fallback]
enabled = false
hosts = ["a.example.com", "b.example.com"]
[fallback.security]
cloudflare_only = true
[fallback.upstream]
endpoint = "http://127.0.0.1:9004"
protocol = "http1" # independent of downstream H1/H2
host_header = "preserve" # preserve or backend
# For https only: request_host uses HTTP host, independent of downstream SNI.
tls_server_name = "request_host"
# ca_file = "certs/cloudflare-origin-ca.pem"

[observability]
mode = "production"
summary_interval_seconds = 300
summary_file = "observability-runtime-production.jsonl"
diagnostic_interval_seconds = 60
diagnostic_file = "observability-runtime-diagnostic.jsonl"
connection_event_logs_enabled = true
# Lifecycle logs never imply per-frame diagnostics. Diagnostic mode still
# enables detail; use this flag for an explicit production diagnostic session.
detailed_frame_observation_enabled = false

# Same ingress path, different domains and upstream paths.

[[routes]]
id = "a-api"
host = "a.example.com"
path = "/api"
backend = "ws://127.0.0.1:9001/socket"
enabled = true
[routes.security]
# Default is false; true restricts only this selected route.
cloudflare_only = true
[routes.handshake]
forward_cookie = true
forward_origin = true
query = "preserve" # preserve client query, or backend for configured target query

[[routes]]
id = "b-api"
host = "b.example.com"
path = "/api"
backend = "ws://127.0.0.1:9002/socket"
enabled = true
[routes.security]
# Default is false; true restricts only this selected route.
cloudflare_only = true
[routes.handshake]
forward_cookie = true
forward_origin = true
query = "preserve" # preserve client query, or backend for configured target query

[[routes]]
id = "a-tcp"
host = "a.example.com"
path = "/tcp"
backend = "tcp://127.0.0.1:9003"
enabled = true
[routes.security]
# Default is false; true restricts only this selected route.
cloudflare_only = true

[[grpc_routes]]
id = "a-grpc"
host = "a.example.com"
path = "/edge.Gateway/Tun"
backend = "h2c://127.0.0.1:50051"
enabled = true
[grpc_routes.security]
# Default is false; true restricts only this selected route.
cloudflare_only = true

[[grpc_routes]]
id = "b-grpc"
host = "b.example.com"
path = "/edge.Gateway/Tun"
backend = "h2c://127.0.0.1:50052"
enabled = true
[grpc_routes.security]
# Default is false; true restricts only this selected route.
cloudflare_only = true

# /app matches /app and /app/...; /application is not a match.
[[http_routes]]
id = "a-app"
host = "a.example.com"
path = "/app"
match = "prefix"
rewrite = "strip_prefix"
[http_routes.security]
cloudflare_only = true
[http_routes.upstream]
endpoint = "http://127.0.0.1:9004"
protocol = "http1"
host_header = "preserve"
[http_routes.upstream.pool]
max_connections = 128
max_idle_connections = 16
max_active_requests = 256
max_pending_requests = 64
idle_timeout_seconds = 60
pending_timeout_seconds = 5
response_header_timeout_seconds = 60
body_idle_timeout_seconds = 60

[[http_routes]]
id = "b-app"
host = "b.example.com"
path = "/app"
match = "prefix"
rewrite = "replace_prefix"
replacement_prefix = "/v1"
[http_routes.security]
cloudflare_only = true
[http_routes.upstream]
endpoint = "http://127.0.0.1:9004"
protocol = "http1"
host_header = "backend"

# Exact overrides prefix, e.g. /app/version remains /app/version.
[[http_routes]]
id = "a-version"
host = "a.example.com"
path = "/app/version"
match = "exact"
rewrite = "preserve"
[http_routes.security]
cloudflare_only = true
[http_routes.upstream]
endpoint = "http://127.0.0.1:9004"
protocol = "http1"

# Cleartext H2 prior knowledge; activate when an H2 application listens here.
[[http_routes]]
id = "a-h2-application"
host = "a.example.com"
path = "/h2-app"
match = "prefix"
rewrite = "strip_prefix"
enabled = false
[http_routes.security]
cloudflare_only = true
[http_routes.upstream]
endpoint = "http://127.0.0.1:9005"
protocol = "http2"
