# edge-gateway owns public :443 in 0.3.1.
# Move each existing TLS virtual server to loopback while keeping its current
# server_name, SSL certificate, locations, proxy_pass/grpc_pass, and WebSocket rules.
server {
    listen 127.0.0.1:9443 ssl;
    http2 on;

    server_name api.trip2w.com;

    ssl_certificate     /path/to/existing/fullchain.pem;
    ssl_certificate_key /path/to/existing/privkey.pem;

    # Keep the existing location blocks unchanged below this line.
    # location /... { ... }
}
