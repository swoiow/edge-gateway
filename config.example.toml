[server]
listen = "0.0.0.0:8443"
tls_handshake_timeout_seconds = 10
websocket_upgrade_timeout_seconds = 10
backend_connect_timeout_seconds = 3
shutdown_grace_seconds = 120
max_websocket_message_size_bytes = 1048576
max_grpc_concurrent_streams_per_backend = 256

# Certificate pairs are discovered by id:
#   certs/gateway.fullchain.pem + certs/gateway.key.pem
#   certs/service-a.fullchain.pem + certs/service-a.key.pem
# SNI names are read from each certificate's DNS SANs, not from the filename.
[tls]
cert_dir = "certs"
cert_suffix = ".fullchain.pem"
key_suffix = ".key.pem"
default_certificate = "gateway"

# Built-in ACME is optional. When disabled, certificates can be managed manually
# or by an external ACME/DNS-01 client and are still served through the same
# multi-certificate store.
[acme]
enabled = false
http01_listen = "0.0.0.0:80"
environment = "production" # use "staging" while testing ACME integration
state_dir = "state/acme"
fallback_renew_before_days = 30
check_interval_hours = 12
# email = "admin@example.com"

# Uncomment together with acme.enabled = true and acme.email.
# Wildcards are intentionally unsupported here because HTTP-01 cannot issue them.
# [[acme.certificates]]
# id = "gateway"
# domains = ["gateway.example.com", "api.example.com"]


# Optional legacy fallback. Explicit edge WebSocket/gRPC routes always win;
# only unmatched requests are forwarded here. For an existing TLS-enabled
# Nginx, move its public listener to loopback (for example 127.0.0.1:9443).
# Host is preserved and TLS SNI defaults to the original downstream SNI/Host.
[fallback]
enabled = false
backend = "https://127.0.0.1:9443"
preserve_host = true
tls_server_name = "request_host"
# ca_file = "certs/cloudflare-origin-ca.pem" # only needed for a private/origin CA

[observability]
mode = "production"
summary_interval_seconds = 300
summary_file = "observability-runtime-production.jsonl"
diagnostic_interval_seconds = 60
diagnostic_file = "observability-runtime-diagnostic.jsonl"
connection_event_logs_enabled = true

# Custom absolute paths are allowed. Paths outside /api/pc|mob|uat emit a warning only.
[[routes]]
id = "route-a"
path = "/custom-ws"
backend = "ws://127.0.0.1:10002/app1"
enabled = true

[[routes]]
id = "develop"
path = "/api/uat/health"
backend = "ws://127.0.0.1:10002/app2"
enabled = true

[[grpc_routes]]
id = "grpc-tun"
path = "/edge.Gateway/Tun"
backend = "h2c://127.0.0.1:50051"
enabled = true
